<code
  [class]="
    (breakpoints.breakpoints$ | async)?.tiny
      ? 'mat-headline-4'
      : 'mat-headline-2'
  "
  >{{ title }}</code
>

<app-list>
  @for (feature of features; track feature) {
    <app-list-item>
      <a [routerLink]="feature.path" (mouseenter)="updateTitle(feature)">
        <app-card>
          <app-card-title>
            {{ feature.name }}
          </app-card-title>
          <app-icon [iconUrl]="feature.iconUrl"></app-icon>
        </app-card>
      </a>
    </app-list-item>
  }
</app-list>

<app-illustration></app-illustration>
